apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-pvc-etc-pihole
  namespace: pihole
  labels:
    env: local

spec:
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-pvc-dnsmasq
  namespace: pihole
  labels:
    env: local

spec:
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-deployment
  namespace: pihole
  labels:
    env: local

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: local

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: pihole-deployment
      labels:
        env: local

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pihole-volume
          persistentVolumeClaim:
            claimName: pihole-pvc-etc-pihole

        - name: dnsmasq-volume
          persistentVolumeClaim:
            claimName: pihole-pvc-dnsmasq

      containers:
        - name: pihole
          image: pihole/pihole:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: default
              containerPort: 8080

            - name: dns
              containerPort: 53

          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: TZ

            - name: FTLCONF_dns_dnssec
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_dns_dnssec

            - name: FTLCONF_DNSMASQ_USER
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DNSMASQ_USER

            - name: FTLCONF_DHCP_rapid_commit
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DHCP_rapid_commit

            - name: FTLCONF_DHCP_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DHCP_ACTIVE

            - name: FTLCONF_webserver_port
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_webserver_port

            - name: FTLCONF_WEB_BIND_ADDR
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_WEB_BIND_ADDR

            - name: FTLCONF_DHCP_START
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DHCP_START

            - name: FTLCONF_DHCP_END
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DHCP_END

            - name: FTLCONF_DHCP_ROUTER
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_DHCP_ROUTER

            - name: FTLCONF_dns_upstreams
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_dns_upstreams

            - name: FTLCONF_dns_listeningMode
              valueFrom:
                configMapKeyRef:
                  name: pihole-config
                  key: FTLCONF_dns_listeningMode

            - name: FTLCONF_WEBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-secrets
                  key: PIHOLE_WEBPASSWORD

            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secrets
                  key: PIHOLE_WEBPASSWORD
