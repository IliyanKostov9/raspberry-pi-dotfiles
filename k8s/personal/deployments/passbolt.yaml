---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: passbolt-db-pvc
  namespace: passbolt
  labels:
    env: prod

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: passbolt-pvc-gpg
  namespace: passbolt
  labels:
    env: prod

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: passbolt-pvc-jwt
  namespace: passbolt
  labels:
    env: prod

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passbolt-deployment
  namespace: passbolt
  labels:
    env: prod

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: prod

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: passbolt-deployment
      labels:
        env: prod

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      containers:
        - name: passbolt-app
          image: passbolt/passbolt:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/wait-for.sh"]
          args: ["-t", "0", "db:5432", "--", "/docker-entrypoint.sh"]
          volumes:
            - name: gpg-volume
              persistentVolumeClaim:
                claimName: passbolt-pvc-gpg

            - name: jwt-volume
              persistentVolumeClaim:
                claimName: passbolt-pvc-jwt
          ports:
            - name: internal-port
              containerPort: 80

        - name: passbolt-db
          image: pgvector/pgvector:pg18-trixie
          imagePullPolicy: IfNotPresent
          volumes:
            - name: gpg-volume
              persistentVolumeClaim:
                claimName: passbolt-pvc-db

          ports:
            - name: db-internal-port
              containerPort: 5432

          resources:
            requests:
              cpu: 2000m
              memory: 2G

            limits:
              cpu: 4000m
              memory: 4G

          env:
            - name: APP_FULL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_APP_BASE_URL

            - name: DATASOURCES_DEFAULT_DRIVER
              value: Cake\Database\Driver\Postgres

            - name: DATASOURCES_DEFAULT_ENCODING
              value: utf8

            - name: DATASOURCES_DEFAULT_URL
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_DATASOURCE_URL

            - name: EMAIL_DEFAULT_FROM_NAME
              value: Passbolt

            - name: EMAIL_DEFAULT_FROM
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_DEFAULT_FROM

            - name: EMAIL_TRANSPORT_DEFAULT_HOST
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_TRANSPORT_DEFAULT_HOST

            - name: EMAIL_TRANSPORT_DEFAULT_CLIENT
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_TRANSPORT_DEFAULT_CLIENT

            - name: EMAIL_TRANSPORT_DEFAULT_PORT
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_TRANSPORT_DEFAULT_PORT

            - name: EMAIL_TRANSPORT_DEFAULT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_TRANSPORT_DEFAULT_USERNAME

            - name: EMAIL_TRANSPORT_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: PASSBOLT_EMAIL_TRANSPORT_DEFAULT_PASSWORD

            - name: EMAIL_TRANSPORT_DEFAULT_TLS
              value: "true"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: passbolt-secrets
                  key: POSTGRES_USERNAME
