---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-pvc
  namespace: portfolio
  labels:
    env: prod

spec:
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  namespace: portfolio
  labels:
    env: prod

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: prod

  strategy:
    type: Recreate

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: portfolio-deployment
      labels:
        env: prod

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: portfolio-volume
          persistentVolumeClaim:
            claimName: portfolio-pvc

      containers:
        - name: django-app
          image: ghcr.io/iliyankostov9/portfolio:release-v3.5.1
          #image: localhost:5000/portfolio:latest3
          imagePullPolicy: IfNotPresent

          ports:
            - name: internal-port
              containerPort: 8000

            - name: inter-loki
              containerPort: 3100

          resources:
            requests:
              cpu: 2000m
              memory: 2G

            limits:
              cpu: 4000m
              memory: 4G

          env:
            - name: PORTFOLIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_SECRET_KEY

            - name: PORTFOLIO_HOST
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_HOST

            - name: PORTFOLIO_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_EMAIL_PASSWORD

            - name: PORTFOLIO_EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_EMAIL_USER

            - name: PORTFOLIO_EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_EMAIL_HOST

            - name: PORTFOLIO_TO_EMAIL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_TO_EMAIL

            - name: PORTFOLIO_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_FROM_EMAIL

            - name: PORTFOLIO_ENV
              value: prod

            - name: PORTFOLIO_S3_MAIN_PROD_BUCKET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_MAIN_PROD_BUCKET

            - name: PORTFOLIO_S3_MAIN_PROD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_MAIN_PROD_SECRET_ACCESS_KEY

            - name: PORTFOLIO_S3_MAIN_PROD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_MAIN_PROD_ACCESS_KEY_ID

            - name: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_BUCKET
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_BUCKET

            - name: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_SECRET_ACCESS_KEY

            - name: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_S3_TEXT_TO_SPEECH_PROD_ACCESS_KEY_ID

            - name: PORTFOLIO_CDN_ASSETS_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_CDN_ASSETS_URL

            - name: PORTFOLIO_LOKI_URL
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: PORTFOLIO_LOKI_URL
