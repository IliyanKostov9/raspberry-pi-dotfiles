---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-pvc
  namespace: portfolio
  labels:
    env: prod

spec:
  storageClassName: "local-path"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  namespace: portfolio
  labels:
    env: prod

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: prod

  strategy:
    type: Recreate

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: portfolio-deployment
      labels:
        env: prod

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: portfolio-volume
          persistentVolumeClaim:
            claimName: portfolio-pvc

      containers:
        - name: django-app
          image: ghcr.io/iliyankostov9/portfolio:release-v3.5.1
          #image: localhost:5000/portfolio:latest3
          imagePullPolicy: IfNotPresent

          ports:
            - name: internal-port
              containerPort: 8000

            - name: inter-loki
              containerPort: 3100

          resources:
            requests:
              cpu: 2000m
              memory: 2G

            limits:
              cpu: 4000m
              memory: 4G

          envFrom:
            - secretRef:
                name: portfolio-secrets
