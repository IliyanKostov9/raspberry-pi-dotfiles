apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing-deployment
  namespace: syncthing
  labels:
    env: local

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: local

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: syncthing-deployment
      labels:
        env: local

    spec:
      securityContext:
        fsGroup: 1000
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: syncthing-volume
          hostPath:
            path: /mnt/storage/syncthing
            type: Directory
      containers:
        - name: syncthing
          image: syncthing/syncthing:edge
          imagePullPolicy: IfNotPresent

          ports:
            - name: default
              containerPort: 8384

          volumeMounts:
            - name: syncthing-volume
              mountPath: /syncthing

          env:
            - name: PUID
              value: "1000"

            - name: PGID
              value: "1000"
