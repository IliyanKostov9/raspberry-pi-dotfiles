apiVersion: v1
kind: PersistentVolume
metadata:
  name: syncthing-pv
  namespace: syncthing
  labels:
    env: local

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing-deployment
  namespace: syncthing
  labels:
    env: local

spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      env: local

  template:
    metadata:
    annotations:
      kubectl.kubernetes.io/default-container: portfolio-deployment
    labels:
      env: local

  spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30
    containers:
      - name: syncthing
        image: syncthing/syncthing:edge
        imagePullPolicy: IfNotPresent

        ports:
          - name: default
            containerPort: 8384

        resources:
          requests:
            cpu: 1000m
            memory: 1G
          limits:
            cpu: 1000m
            memory: 2G

        env:
          - name: PUID
            value: 1000

          - name: PGID
            value: 1000
