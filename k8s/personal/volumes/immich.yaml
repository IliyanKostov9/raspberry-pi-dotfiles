apiVersion: v1
kind: PersistentVolume
metadata:
  name: library
  namespace: immich
  labels:
    env: immich

spec:
  storageClassName: "library"
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /usr/src/app/upload
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: localtime
  namespace: immich
  labels:
    env: immich

spec:
  storageClassName: "localtime"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /etc/localtime
  persistentVolumeReclaimPolicy: Retain
