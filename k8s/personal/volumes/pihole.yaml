---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole-pv-etc-pihole
  labels:
    env: local

spec:
  storageClassName: "pihole"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/pi/repos/raspberry-pi-dotfiles/config/etc2
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pihole-pv-etc-dnsmasq
  labels:
    env: local

spec:
  storageClassName: "dnsmasq"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/pi/repos/raspberry-pi-dotfiles/config/etc-dnsmasq.d
  persistentVolumeReclaimPolicy: Retain
