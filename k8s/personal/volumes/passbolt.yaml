apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pv-gpg
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: "gpg"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/passbolt/gpg
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pv-jwt
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: "jwt"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/passbolt/jwt
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pv-db
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: "local-path"
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/storage/postgres18/18/docker
  persistentVolumeReclaimPolicy: Retain
