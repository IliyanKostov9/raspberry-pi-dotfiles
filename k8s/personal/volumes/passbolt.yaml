apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pvc-gpg
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: "gpg"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/passbolt/gpg
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pvc-jwt
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: "jwt"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/passbolt/jwt
  persistentVolumeReclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: passbolt-pvc-db
  namespace: passbolt
  labels:
    env: prod

spec:
  storageClassName: db
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/storage/postgres18:/var/lib/postgresql
  persistentVolumeReclaimPolicy: Retain
