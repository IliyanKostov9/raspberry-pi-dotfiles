apiVersion: v1
kind: Service
metadata:
  name: pihole-service
  labels:
    env: local

spec:
  selector:
    env: local

  ports:
    - name: local-53-port
      port: 53
      protocol: TCP
      targetPort: 53

    - name: local-8080-port
      port: 8080
      protocol: TCP
      targetPort: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-ingress-route
  namespace: pihole
  labels:
    env: local

spec:
  routes:
    - kind: Rule
      match: Host(`192.168.1.99`)
      services:
        - name: pihole-service
          port: 8080
