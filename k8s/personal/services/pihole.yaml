apiVersion: v1
kind: Service
metadata:
  name: pihole-service
  labels:
    env: local

spec:
  selector:
    env: local

  type: NodePort
  ports:
    - name: local-53-port
      port: 53
      protocol: TCP
      targetPort: 53

    - name: local-8080
      port: 8080
      protocol: TCP
      targetPort: 8080
      nodePort: 30080
