apiVersion: v1
kind: Service
metadata:
  name: pihole-service
  namespace: pihole
  labels:
    env: local

spec:
  selector:
    env: local

  type: NodePort
  ports:
    - name: local-53-port
      port: 53
      protocol: TCP
      targetPort: 53

    - name: local-80
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30080
