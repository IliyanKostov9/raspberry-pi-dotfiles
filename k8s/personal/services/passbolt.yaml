---
apiVersion: v1
kind: Service
metadata:
  name: passbolt-service
  namespace: passbolt
  labels:
    env: prod

spec:
  selector:
    env: prod

  ports:
    - name: asgi
      port: 80
      protocol: TCP
      targetPort: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: passbolt-ingress-route
  namespace: passbolt
  labels:
    env: prod

spec:
  headers:
    sslRedirect: true
    sslProxyHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: passbolt-ingress-route
  namespace: passbolt
  labels:
    env: prod

spec:
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`passbolt.ikostov.org`)
      services:
        - name: passbolt-service
          port: 80
      middlewares:
        - name: passbolt-ingress-route
          namespace: passbolt
