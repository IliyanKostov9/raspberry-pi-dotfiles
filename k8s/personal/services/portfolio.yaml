---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  selector:
    version: v2.3.1
    env: prod

  ports:
    - name: asgi
      port: 8000
      protocol: TCP
      targetPort: 8000

    - name: https
      port: 443
      protocol: TCP
      targetPort: 443

    - name: loki
      port: 3100
      protocol: TCP
      targetPort: 3100

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-ingress-route
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  tls:
   options:
     default:
       minVersion: VersionTLS12
       sniStrict: true
       curvePreferences:
         - CurveP521
         - CurveP384
       cipherSuites:
         - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
         - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
         - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256

  headers:
    FrameDeny: true
    AccessControlAllowMethods: 'GET,OPTIONS,PUT'
    AccessControlAllowOriginList:
      - origin-list-or-null
    AccessControlMaxAge: 100
    AddVaryHeader: true
    BrowserXssFilter: true
    ContentTypeNosniff: true
    ForceSTSHeader: true
    STSIncludeSubdomains: true
    STSPreload: true
    #ContentSecurityPolicy: default-src 'self' 'unsafe-inline'
    ContentSecurityPolicy: >
      default-src 'self';
      script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com;
      font-src 'self' https://fonts.gstatic.com;
      style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
    CustomFrameOptionsValue: SAMEORIGIN
    ReferrerPolicy: same-origin
    PermissionsPolicy: vibrate 'self'
    STSSeconds: 315360000

  entryPoints:
    web:
      address: ":80"
    websecure:
      address: ":443"

  certificatesResolvers:
    letsResolve:
      acme:
        email: iliyan.kostov@email.ikostov.org
        storage: config/shared/acme.json
        httpChallenge:
          entryPoint: web

  routes:
    - kind: Rule
      match: Host('portfolio.ikostov.org')
      services:
        - name: portfolio-service
          port: 8000
      middlewares:
        - name: "SslHeader@file"
          namespace: portfolio

    - kind: Rule
      match: Host('portfolio.ikostov.org')
      services:
        - name: portfolio-service
          port: 443
      middlewares:
        - name: "SslHeader@file"
          namespace: portfolio
