---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  selector:
    version: v2.3.1
    env: prod

  ports:
    - name: asgi
      port: 8000
      protocol: TCP
      targetPort: 8000

    - name: https
      port: 443
      protocol: TCP
      targetPort: 443

    - name: loki
      port: 3100
      protocol: TCP
      targetPort: 3100

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-ingress-route
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  headers:
    sslRedirect: true
    sslProxyHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-ingress-route
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  routes:
    - kind: Rule
      match: Host(`portfolio.ikostov.org`)
      services:
        - name: portfolio-service
          port: 8000
      middlewares:
        - name: portfolio-ingress-route
          namespace: portfolio

    - kind: Rule
      match: Host(`portfolio.ikostov.org`)
      services:
        - name: portfolio-service
          port: 443
      middlewares:
        - name: portfolio-ingress-route
          namespace: portfolio
