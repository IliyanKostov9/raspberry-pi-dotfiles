apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio
  labels:
    version: v2.3.1
    env: prod

spec:
  type: NodePort

  selector:
    version: v2.3.1
    env: prod

  ports:
    - name: asgi
      port: 8000
      protocol: TCP
      targetPort: 8000
      nodePort: 30000

    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 30001

    - name: loki
      port: 3100
      protocol: TCP
      targetPort: 3100
      nodePort: 30002
      
      
